<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesso Administrativo | Puro Luxo Grife</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <header class="login-header">
          <span class="brand-badge">Puro Luxo Grife</span>
          <h1>Painel de Gestao</h1>
          <p>Informe suas credenciais para gerenciar os agendamentos VIP.</p>
        </header>

        <div id="login-alert" class="alert alert-error" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">E-mail de Acesso</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-control" 
              placeholder="admin@puroluxo.com" 
              required 
              autocomplete="email"
              autofocus
            >
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input 
              type="password" 
              id="senha" 
              name="senha" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
          </div>

          <button type="submit" id="btn-submit" class="btn-primary">
            <span>Acessar Painel</span>
          </button>
        </form>

        <footer class="login-footer">
          <a href="/">← Voltar para a pagina principal</a>
        </footer>
      </div>
    </div>

    <script src="/js/login.js"></script>
  </body>
</html>
